<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PDwise Clinical</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700&family=Red+Hat+Text:wght@400;500;600&family=Red+Hat+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (nav + hasta seçici) · sticky top bar · scrollable clinical workspace; all cards flat, one accent reserved for actions */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EDF0F4; --line:#D7DDE5; --line-strong:#B9C2CE;
  --fg:#17212B; --fg-2:#4A5666; --muted:#73808F;
  --accent:#2E5A86; --accent-fg:#FFFFFF; --accent-soft:#E3ECF6;
  --good:#1F7A4D; --good-soft:#E1F3E8; --warn:#9A6B12; --warn-soft:#FBF0D5; --serious:#B4471B; --serious-soft:#FCE6DA; --critical:#A3261F;
  --aw:#2F6DB5; --pkg:#C2662A; --stat:#1F8F7A;
  --m0:#F0E6D6; --m1:#E6C9A0; --m2:#D9A66A; --m3:#C27F3C; --m4:#935725; /* motor yük ramp: açık→koyu */
  --shadow:0 1px 2px rgba(23,33,43,.06);
  --display:"Red Hat Display",system-ui,sans-serif; --text:"Red Hat Text",system-ui,sans-serif; --mono:"Red Hat Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#161E27; --surface-2:#1E2833; --line:#2A3542; --line-strong:#3B4857;
  --fg:#E7ECF1; --fg-2:#B5C0CC; --muted:#8793A0;
  --accent:#7FA8D6; --accent-fg:#0F151C; --accent-soft:#1F2F42;
  --good:#5CC48E; --good-soft:#163426; --warn:#E0B04A; --warn-soft:#3A2E12; --serious:#F08A5A; --serious-soft:#3F2416; --critical:#F27C74;
  --aw:#5A8FD8; --pkg:#C97638; --stat:#2FA488;
  --m0:#2A2A2A; --m1:#4A3A2A; --m2:#7A5530; --m3:#B07234; --m4:#E0A05A;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#161E27; --surface-2:#1E2833; --line:#2A3542; --line-strong:#3B4857;
  --fg:#E7ECF1; --fg-2:#B5C0CC; --muted:#8793A0;
  --accent:#7FA8D6; --accent-fg:#0F151C; --accent-soft:#1F2F42;
  --good:#5CC48E; --good-soft:#163426; --warn:#E0B04A; --warn-soft:#3A2E12; --serious:#F08A5A; --serious-soft:#3F2416; --critical:#F27C74;
  --aw:#5A8FD8; --pkg:#C97638; --stat:#2FA488;
  --m0:#2A2A2A; --m1:#4A3A2A; --m2:#7A5530; --m3:#B07234; --m4:#E0A05A;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12.5px}
a{color:var(--accent)}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-block:14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-family:var(--display);font-weight:700;font-size:13px}
.brand b{font-family:var(--display);font-size:16px;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--muted)}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav .grp{margin:12px 6px 4px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:7px;color:var(--fg-2);cursor:pointer;font-weight:500}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn .k{margin-left:auto;font-size:11px;background:var(--serious);color:#fff;border-radius:10px;padding:0 6px;font-family:var(--mono)}
.nav-ic{width:16px;height:16px;flex:none;opacity:.8}
.rail-foot{margin-top:auto;padding:12px 6px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.rail-foot b{display:block;color:var(--fg);font-weight:600}

.main{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .sp{flex:1}
.pt-select{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px 5px 10px}
.pt-select select{border:0;background:transparent;font-weight:600;cursor:pointer;max-width:260px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;color:var(--fg-2);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.demo-tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:3px 8px}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:34px;cursor:pointer}

.work{flex:1;overflow:auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;gap:18px;max-width:1240px;margin:0 auto}
.screen-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.screen-head .sp{flex:1}
.screen-head p{color:var(--fg-2);max-width:68ch;margin-top:4px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h .sp{flex:1}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:focus-visible,.nav-btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.eval{color:var(--serious);background:var(--serious-soft)}
.pill.new{color:var(--warn);background:var(--warn-soft)}
.pill.data{color:var(--muted);background:var(--surface-2)}
.pill.due{color:var(--accent);background:var(--accent-soft)}
.pill.ok{color:var(--good);background:var(--good-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--fg-2)}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip.aw i{background:var(--aw)}.chip.pkg i{background:var(--pkg)}.chip.stat i{background:var(--stat)}.chip.ema i{background:var(--fg-2);border-radius:50%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.row-btn{cursor:pointer}tr.row-btn:hover td{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto}
.stat{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.01em;line-height:1}
.stat .l{font-size:12px;color:var(--muted)}
.stat .d{font-size:12px;color:var(--fg-2)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.g>i{background:var(--good)}.bar.w>i{background:var(--warn)}.bar.s>i{background:var(--serious)}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 12px;font-size:13px;background:var(--accent-soft);color:var(--fg)}
.notice.warn{background:var(--warn-soft)}
.notice svg{flex:none;margin-top:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.swatch-row{display:flex;gap:2px}
.swatch-row i{height:10px;width:18px;display:block;border-radius:2px}
.insight{border-left:3px solid var(--serious);padding-left:14px}
.insight.n{border-left-color:var(--warn)}
.insight.d{border-left-color:var(--muted)}
.insight dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px;margin-top:10px}
.insight dt{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.03em}
.insight dd{margin:0}
.insight ul{margin:0;padding-left:16px}
@media (max-width:640px){.insight dl{grid-template-columns:1fr}}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
summary{cursor:pointer;padding:8px 12px;font-weight:600;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details[open] summary::before{transform:rotate(45deg)}
details .inner{padding:0 12px 12px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px}
.field label{font-weight:600;color:var(--fg-2);font-size:12.5px}
.field select,.field input,.field textarea{border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;background:var(--surface);min-width:0;width:100%}
.field textarea{min-height:72px;resize:vertical}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-row label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;font-weight:500}
.radio-row input{accent-color:var(--accent)}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;font-family:var(--mono)}
.timeline-list{display:flex;flex-direction:column}
.timeline-list>div{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.timeline-list>div:last-child{border-bottom:0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.dialog{position:fixed;inset:0;background:rgba(10,16,24,.45);display:grid;place-items:center;z-index:40;padding:16px}
.dialog .card{width:min(520px,100%);max-height:90vh;overflow:auto}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;max-width:260px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tip b{display:block;font-family:var(--mono);font-weight:500}
.likert{display:grid;grid-template-columns:1fr repeat(5,44px);gap:4px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.likert:last-child{border-bottom:0}
.likert .c{height:30px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.likert .c.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
@media (max-width:640px){.likert{grid-template-columns:1fr repeat(5,32px)}}
.score-ring{width:92px;height:92px;flex:none}
.cmp{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 14px;font-size:13px;align-items:center}
.cmp>b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cmp>span{padding:7px 0;border-bottom:1px solid var(--line)}
.delta{font-family:var(--mono);font-weight:500}
.delta.good{color:var(--good)}.delta.bad{color:var(--serious)}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart-wrap{overflow-x:auto}
.day-row-sel rect.cell{stroke:var(--fg);stroke-width:1}
.report{font-size:13.5px;line-height:1.65;max-width:72ch}
.report h3{margin:16px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.report ul{margin:4px 0;padding-left:18px}
.note{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;background:var(--surface-2)}
.note .m{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-bottom:4px}
.alert-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.alert-row:last-child{border-bottom:0}
.alert-row.done{opacity:.55}
.alert-row .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.alert-row{grid-template-columns:auto 1fr}.alert-row .act{grid-column:1/-1;justify-content:flex-start}}
.sev{width:8px;height:40px;border-radius:4px;background:var(--muted);margin-top:2px}
.sev.eval{background:var(--serious)}.sev.new{background:var(--warn)}.sev.due{background:var(--accent)}
.foot-ai{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:12px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:260px;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .rail.open{transform:none}
  .menu-btn{display:grid;place-items:center}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand"><div class="brand-mark">PD</div><div><b>PDwise Clinical</b><span>Nöroloji · Hareket Bozuklukları</span></div></div>

</div>

<script>
/* ---------- yardımcılar ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DAYS_TR=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const TODAY=new Date(2026,9,25);
function dateOf(dayIdx,total){const d=new Date(TODAY);d.setDate(d.getDate()-(total-1-dayIdx));return d}
const fmtD=d=>`${d.getDate()} ${['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'][d.getMonth()]}`;
const hhmm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(Math.round(m%60)).padStart(2,'0')}`;
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
try{if(location.hash&&/^#[a-z\-]+$/.test(location.hash))window.__startView=location.hash.slice(1)}catch(e){}

/* ---------- sentetik hasta seti ---------- */
/* Tüm kişiler ve sayılar kurgusaldır. Gerçek hasta verisi içermez. */
const SCHED=[8*60,12*60,16*60,20*60]; // planlı dozlar (dk)
function genPatient(p){
  const r=rng(p.seed);const total=30;const days=[];
  for(let d=0;d<total;d++){
    const date=dateOf(d,total);
    const wear=p.wearBase+Math.round((r()-.5)*p.wearVar);
    const doses=SCHED.slice(0,p.dosesPerDay).map((t,i)=>{
      let status='alindi',delay=0;const u=r();
      if(u<p.pMiss)status='atlandi';else if(u<p.pMiss+p.pLate){status='gecikti';delay=25+Math.round(r()*70)}
      else if(u<p.pMiss+p.pLate+p.pUnknown)status='kayit-yok';
      return{sched:t,status,delay,reported:status==='alindi'?t+Math.round((r()-.5)*14):status==='gecikti'?t+delay:null}
    });
    // saatlik motor yük 06:00–23:00 (0–100; yüksek=kötü)
    const motor=[];let fogEvents=[];
    for(let h=6;h<=23;h++){
      let v=p.base+(r()-.5)*10;
      // doz sonu kötüleşme: bir sonraki plandan önceki 60–90 dk
      doses.forEach((ds,i)=>{
        const next=SCHED[i+1]??(SCHED[i]+240);
        const tookAt=ds.reported;
        if(tookAt!=null){
          const dt=h*60-tookAt;
          if(dt>=30&&dt<=150)v-=p.response*(1-Math.abs(dt-90)/60)*.9;  // ON penceresi
          if(h*60>=next-90&&h*60<next)v+=p.wearOff*(1+(ds.delay||0)/60);  // wearing-off
        }else{ if(h*60>=ds.sched&&h*60<next)v+=p.wearOff*1.3 }
      });
      if(p.fog&&v>62&&r()<.35)fogEvents.push({h,n:1+Math.round(r()*2)});
      motor.push(Math.max(8,Math.min(96,Math.round(v))))
    }
    const emas=[];
    if(doses.some(x=>x.status==='kayit-yok')&&r()<.8){emas.push({t:hhmm(SCHED[doses.findIndex(x=>x.status==='kayit-yok')]+95),q:'Son planlanan ilacınızı aldınız mı?',a:r()<.6?'Evet, geç aldım':'Hatırlamıyorum'})}
    if(Math.max(...motor)>70&&r()<.5)emas.push({t:hhmm(6*60+motor.indexOf(Math.max(...motor))*60+10),q:'Şu anda hareket etmekte zorlanıyor musunuz?',a:r()<.7?'Evet, belirgin':'Biraz'});
    days.push({date,wear:Math.max(20,Math.min(100,wear)),doses,motor,fog:fogEvents,emas,
      pkg:p.pkgDays&&d>=p.pkgDays[0]&&d<=p.pkgDays[1],stat:p.statDays&&d>=p.statDays[0]&&d<=p.statDays[1],
      sleepH:+(5.6+r()*2.4).toFixed(1),steps:Math.round(2600+r()*4200)})
  }
  return{...p,days}
}

function metrics(p){

}

 if(!list.length)list.push({sev:'d',title:'Kişisel temel çizgiden anlamlı sapma yok',period:`Son ${m.n} gün`,sources:['Apple Watch','İlaç kaydı'],reliability:`${m.reliability}/100`,explain:['Motor yük ve ilaç kaydı önceki profille uyumlu'],alt:['—'],unc:['Sensör motor dışı belirtileri ölçmez'],points:['Planlı takip sürdürülebilir'],cmp:'Stabil'});
 return list}

   <div class="card"><div class="card-h"><h2>Neden ADL?</h2></div><div class="card-b small" style="display:grid;gap:8px"><p>Sensörler hareketi ölçer; hastanın günlük yaşamının bu hareketten nasıl etkilendiğini ölçmez. ADL ölçeği bu boşluğu hasta beyanıyla kapatır ve PKG/STAT-ON raporlarında bulunmayan bağlamı ekler.</p><p class="muted">Sensör motor yükü ile ADL puanı arasındaki ilişki bu hastada 2 ölçüm noktasıyla yorumlanamaz; en az 3 ölçüm gerekir (Hypothesis).</p></div></div>
  </div>
 </div>`}
POST.tests=p=>{const a=state.adl[p.id]||{st:'none'};
 const nowStr=`${fmtD(TODAY)} 2026 ${new Date().getHours().toString().padStart(2,'0')}:${new Date().getMinutes().toString().padStart(2,'0')}`;
 $('#tAssign')?.addEventListener('click',()=>{state.adl[p.id]={st:'assigned',when:nowStr,cg:$('#tCg').checked};render();toast('PDQ-39 ADL hastaya gönderildi')});
 $('#tPreview')?.addEventListener('click',()=>{const host=$('#dlgHost');host.innerHTML=`<div class="dialog" id="dlg"><div class="card" style="width:min(380px,100%)"><div class="card-h"><h2>Hasta görünümü · PDwise Care</h2><div class="sp"></div><button class="btn sm" data-close>Kapat</button></div><div class="card-b" style="display:grid;gap:12px;font-size:16px">
  <p style="font-size:14px;color:var(--fg-2)">Dr. Sarıkaya sizden kısa bir anket istedi. Son 1 ayı düşünerek yanıtlayın. 6 soru, yaklaşık 2 dakika.</p>
  <div style="border:1px solid var(--line);border-radius:12px;padding:16px"><div class="eyebrow">Soru 1 / 6</div><p style="font-family:var(--display);font-weight:600;font-size:18px;margin-top:6px">[Madde metni — lisans sonrası eklenecek]</p><div style="display:grid;gap:8px;margin-top:12px">${LIKERT.map(l=>`<div style="border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;min-height:48px;display:flex;align-items:center">${l}</div>`).join('')}</div></div>
  <p class="small muted">Büyük dokunma hedefleri (≥48 px), yüksek kontrast, "daha sonra" seçeneği ve bakım veren modu hasta uygulamasında mevcuttur.</p></div></div></div>`;host.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>host.innerHTML='');$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')host.innerHTML=''})});
 $('#tCancel')?.addEventListener('click',()=>{delete state.adl[p.id];render();toast('Atama iptal edildi')});
 $('#tSimulate')?.addEventListener('click',()=>{const r=rng(p.seed+99);const base=p.adlPrev?p.adlPrev.items:[1,1,2,1,1,1];const items=base.map(v=>Math.max(0,Math.min(4,v+(p.status==='eval'?(r()<.5?1:0):p.status==='ok'?0:(r()<.3?1:0)))));state.adl[p.id]={st:'done',when:nowStr,cg:a.cg,items};render();toast('Hasta yanıtı alındı · skor hesaplandı')});
 $('#tReset')?.addEventListener('click',()=>{delete state.adl[p.id];render()})}

/* --- 9. Notlar --- */
SCREENS.notes=p=>head('Tedavi Değerlendirme Notları','Hekimin değerlendirme kararı ve takip hedefleri. Sistem içgörüleri burada hekim yorumuyla kapatılır veya ertelenir.')+ptBanner(p)+
 `<div class="grid g-main">
  <div class="card"><div class="card-h"><h2>Yeni değerlendirme notu</h2></div><div class="card-b" style="display:grid;gap:12px">
   <div class="field"><label for="nType">Değerlendirme sonucu</label><select id="nType"><option>İzleme devam — tedavi değişikliği yok</option><option>Hasta ile görüşme planlandı</option><option>Tedavi planı güncellendi (hekim kararı)</option><option>İleri tedavi değerlendirmesi için yönlendirme</option><option>İçgörü yanlış pozitif olarak kapatıldı</option></select></div>
   <div class="field"><label for="nGoal">Takip hedefi (hekim tanımlı)</label><input id="nGoal" placeholder="Örn. 4 hafta içinde doz sonu kötüleşme günü ≤ 3/14"></div>
   <div class="field"><label for="nTxt">Not</label><textarea id="nTxt" placeholder="Klinik gözlem, hasta görüşmesi özeti, karar gerekçesi…"></textarea></div>
   <div class="field"><label><input type="checkbox" id="nShare" style="accent-color:var(--accent)"> Notun sade özetini hastanın uygulamasında göster</label></div>
   <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn primary" id="nSave">Notu kaydet</button></div></div></div>
  <div class="card"><div class="card-h"><h2>Önceki notlar</h2></div><div class="card-b" style="display:grid;gap:10px" id="noteList">${(state.notes[state.pt]||[]).slice().reverse().map(n=>`<div class="note"><div class="m"><span class="num">${esc(n.d)}</span><span>${esc(n.a)}</span>${n.g?`<span>· hedef: ${esc(n.g)}</span>`:''}</div>${esc(n.t)}</div>`).join('')||'<p class="muted small">Kayıtlı not yok.</p>'}</div></div>
 </div>`;
POST.notes=p=>{$('#nSave').onclick=()=>{const t=$('#nTxt').value.trim();if(!t){toast('Not metni boş olamaz');return}(state.notes[state.pt]??=[]).push({d:`${fmtD(TODAY)} 2026`,a:'Dr. E. Sarıkaya',t:`${$('#nType').value}. ${t}`,g:$('#nGoal').value.trim()});render();toast('Not kaydedildi')}}

/* --- 10. Karşılaştırma --- */
SCREENS.compare=p=>{const all=p.days;const A=all.slice(0,14),B=all.slice(16,30);
 const mm=w=>{const doses=w.flatMap(d=>d.doses);const high=w.reduce((a,d)=>a+d.motor.filter(v=>v>60).length,0);return{off:(high/w.length).toFixed(1),late:doses.filter(x=>x.status==='gecikti').length,unk:doses.filter(x=>x.status==='kayit-yok').length,avg:Math.round(w.flatMap(d=>d.motor).reduce((a,b)=>a+b,0)/w.flatMap(d=>d.motor).length),sleep:(w.reduce((a,d)=>a+d.sleepH,0)/w.length).toFixed(1),steps:Math.round(w.reduce((a,d)=>a+d.steps,0)/w.length),fog:w.reduce((a,d)=>a+d.fog.reduce((s,f)=>s+f.n,0),0),wear:Math.round(w.reduce((a,d)=>a+d.wear,0)/w.length)}};
 const a=mm(A),b=mm(B);const row=(l,x,y,lowerBetter=true,fmt=v=>v)=>{const d=+y-+x;const cls=d===0?'':(lowerBetter?d<0:d>0)?'good':'bad';return `<span>${l}</span><span class="num">${fmt(x)}</span><span class="num">${fmt(y)}</span><span class="delta ${cls}">${d>0?'+':''}${Number.isInteger(d)?d:d.toFixed(1)}</span>`};
 return head('Takip Karşılaştırması','İki dönemin yan yana özeti. Dönem A: önceki 14 gün (referans). Dönem B: son 14 gün. Değişimler gözlemseldir ve veri güvenilirliğiyle birlikte okunmalıdır.')+ptBanner(p)+
 `<div class="grid g-main"><div class="card"><div class="card-h"><h2>Dönem A → Dönem B</h2><div class="sp"></div><span class="small muted">${fmtD(A[0].date)}–${fmtD(A[13].date)} → ${fmtD(B[0].date)}–${fmtD(B[13].date)}</span></div><div class="card-b"><div class="cmp"><b>Ölçüt</b><b>A</b><b>B</b><b>Δ</b>
  ${row('OFF benzeri saat / gün',a.off,b.off)}${row('Ortalama motor yük',a.avg,b.avg)}${row('Gecikmiş doz',a.late,b.late)}${row('Kayıt olmayan doz',a.unk,b.unk)}${p.fog?row('FoG epizodu',a.fog,b.fog):''}${row('Uyku (sa)',a.sleep,b.sleep,false)}${row('Adım / gün',a.steps,b.steps,false,v=>Number(v).toLocaleString('tr-TR'))}${row('Saat takılma (%)',a.wear,b.wear,false)}
  </div><p class="small muted" style="margin-top:12px">Yeşil: olumlu yönde değişim; turuncu: olumsuz yönde. Tek bir dönem karşılaştırması tedavi etkisini kanıtlamaz; mevsim, aktivite ve veri kapsamı farkları eş zamanlı değerlendirilmelidir.</p></div></div>
  <div class="card"><div class="card-h"><h2>Tedavi değişikliği öncesi / sonrası</h2></div><div class="card-b small" style="display:grid;gap:8px">${p.id==='D-4125'?`<p><b>30 Tem 2026:</b> Entakapon eklendi.</p><p>12 haftalık izlemde doz sonu kötüleşme günleri azaldı; diskinezi göstergesi hafif arttı (PKG DKS ortalaması 4.1 → 5.6, Company-reported ölçek). Randevuda değerlendirilecek.</p>`:`<p class="muted">Bu dönemde kayıtlı tedavi değişikliği yok. Hekim planı güncellediğinde bu bölüm değişiklik tarihini referans alarak otomatik bölünür.</p>`}</div></div></div>
 <div class="card"><div class="card-h"><h2>Saatlik ortalama profil · A vs B</h2></div><div class="card-b chart-wrap" id="cmpHost"></div></div>`}
POST.compare=p=>{const all=p.days;const A=all.slice(0,14),B=all.slice(16,30);const prof=w=>Array.from({length:18},(_,h)=>Math.round(w.reduce((a,d)=>a+d.motor[h],0)/w.length));const pa=prof(A),pb=prof(B);
 const W=760,H=220,pl=34,pr=16,pt=14,pb_=30;const x=h=>pl+h*(W-pl-pr)/17,y=v=>pt+(100-v)*(H-pt-pb_)/100;
 const ln=(arr,c,dash)=>`<path d="${arr.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2" ${dash?`stroke-dasharray="${dash}"`:''}/>`+arr.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${c}" stroke="var(--surface)" stroke-width="1.5" data-tip="${String(i+6).padStart(2,'0')}:00|${c.includes('muted')?'Dönem A':'Dönem B'}: ${v}"/>`).join('');
 $('#cmpHost').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:480px;display:block">${[0,25,50,75,100].map(g=>`<line x1="${pl}" x2="${W-pr}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(g)+4}" text-anchor="end">${g}</text>`).join('')}
 ${SCHED.slice(0,p.dosesPerDay).map(t=>`<line x1="${x(t/60-6)}" x2="${x(t/60-6)}" y1="${pt}" y2="${H-pb_}" stroke="var(--line-strong)" stroke-dasharray="2 3"/><text x="${x(t/60-6)}" y="${H-pb_+13}" text-anchor="middle">${hhmm(t)}</text>`).join('')}
 ${ln(pa,'var(--muted)','5 3')}${ln(pb,'var(--accent)')}</svg><div class="legend" style="margin-top:8px"><span><i style="background:var(--muted)"></i>Dönem A (referans)</span><span><i style="background:var(--accent)"></i>Dönem B (son 14 gün)</span><span class="muted">kesikli dikey çizgiler: planlı dozlar</span></div>`}

/* --- 11. Rapor --- */
SCREENS.report=p=>{const m=metrics(p);const a=state.adl[p.id];const ins=insightsFor(p)[0];
 return head('Klinik Rapor','Hekim onayıyla üretilen, PDF/EHR dışa aktarımına uygun yapılandırılmış özet. Taslak; hekim düzenleyip onaylar.',`<button class="btn" id="rCopy">Metni kopyala</button><button class="btn primary" id="rApprove">Onayla ve kaydet</button>`)+
 `<div class="card"><div class="card-b report" id="reportBody">
  <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px"><div><div class="eyebrow">PDwise Clinical · Dönem raporu</div><div style="font-family:var(--display);font-size:18px;font-weight:600">Hasta ${esc(p.id)}</div><div class="small muted">${p.age} yaş · ${p.sex} · Tanı ${p.dx} · H&Y ${p.hy} · Rapor tarihi 25 Eki 2026 · Dönem: son ${state.range} gün</div></div><div class="small muted" style="text-align:right">Hazırlayan: sistem (rules-v0.3)<br>Onay: <b>Bekliyor</b></div></div>
  <h3>Veri kaynakları ve güvenilirlik</h3><p>Apple Watch sürekli izlem (ortalama takılma %${m.wear})${m.pkgDays?`; PKG 7 günlük klinik izlem (${m.pkgDays} gün bu dönemde)`:''}${m.statDays?`; STAT-ON 7 günlük yürüyüş izlemi (${m.statDays} gün)`:''}; hasta ilaç kaydı (${m.doses} planlı doz, ${m.unk} kayıtsız); ${m.emaN} hedefli hasta bildirimi. Bileşik güvenilirlik ${m.reliability}/100.</p>
  <h3>Gözlenen örüntü</h3><p>${esc(ins.title)}. ${esc(ins.period)}. Sensör tahminine göre günlük OFF benzeri süre ${m.offHoursPerDay} saat; ${m.wearOffDays} günde planlanan sonraki dozdan önce motor yük eşiği aşıldı. ${m.late} gecikmiş, ${m.miss} atlanmış doz bildirimi mevcut. Diğer günlerde ilaç alımı bağımsız olarak doğrulanmamıştır.</p>
  <h3>İlaç kullanımı</h3><p>Hekim onaylı plan: ${esc(p.meds)}. Kayıtlar hasta beyanıdır; alım kaydı ilacın etkisini göstermez.</p>
  <h3>Hasta bildirimli sonuç (ADL)</h3><p>${a?.st==='done'?`PDQ-39 ADL alt ölçeği ${adlScore(a.items)}/100 (${a.when})${p.adlPrev?`; önceki ${adlScore(p.adlPrev.items)} (${p.adlPrev.date})`:''}.`:p.adlPrev?`Son PDQ-39 ADL ${adlScore(p.adlPrev.items)}/100 (${p.adlPrev.date}); bu dönemde yeni ölçüm yok.`:'Bu dönemde ADL ölçümü yok.'}</p>
  <h3>Olası ve alternatif açıklamalar</h3><ul>${ins.explain.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><p class="small muted">Alternatif: ${ins.alt.map(esc).join('; ')}.</p>
  <h3>Belirsizlikler</h3><ul>${ins.unc.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>
  <h3>Hekim değerlendirmesine sunulan noktalar</h3><ul>${ins.points.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>
  <h3>Hekim notu</h3><p class="muted">${(state.notes[state.pt]||[]).slice(-1)[0]?.t?esc((state.notes[state.pt]||[]).slice(-1)[0].t):'(onay sırasında eklenir)'}</p>
  <p class="foot-ai">Bu rapor sensör ve hasta bildirimi örüntülerinin istatistiksel özetidir; tanı koymaz, doz veya tedavi önermez. Nedensellik iddiası içermez. Klinik karar ve sorumluluk hekime aittir. Rapor hekim onayı olmadan hasta veya üçüncü taraflarla paylaşılmaz.</p>
 </div></div>`}
POST.report=()=>{$('#rCopy').onclick=()=>{const t=$('#reportBody').innerText;navigator.clipboard?.writeText(t).then(()=>toast('Rapor metni panoya kopyalandı')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#reportBody'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Metin seçildi · kopyalamak için Ctrl/Cmd+C')})};$('#rApprove').onclick=()=>toast('Rapor hekim onayıyla kaydedildi (demo)')}

/* --- 12. Uyarılar --- */
SCREENS.alerts=()=>head('Uyarı İnceleme ve Çözüm','Sistem uyarıları açıklanabilir ve kapatılabilir. Her kapatma modelin yanlış pozitif izlemine geri bildirim olarak işlenir. Acil tıbbi durum tespiti bu sistemin kullanım amacı değildir.')+
 `<div class="card"><div class="card-h"><h2>Uyarılar</h2><div class="sp"></div><div class="seg" id="alertFilter"><button data-f="open" aria-pressed="true">Açık</button><button data-f="deferred" aria-pressed="false">Ertelenen</button><button data-f="all" aria-pressed="false">Tümü</button></div></div><div class="card-b" id="alertList" style="padding-top:4px"></div></div>`;
function drawAlerts(f='open'){const list=state.alerts.filter(a=>f==='all'||a.st===f);$('#alertList').innerHTML=list.map(a=>`<div class="alert-row ${a.st==='resolved'?'done':''}"><div class="sev ${a.sev}"></div><div><div class="small muted"><button class="btn ghost sm" data-pt="${a.pt}" data-go="overview" style="padding:0 4px 0 0">${esc(PATIENTS[a.pt].id)}</button>· ${esc(a.when)} · ${{eval:'Değerlendirme öneriliyor',new:'Yeni örüntü',data:'Veri yetersiz',due:'Planlı takip'}[a.sev]}${a.st!=='open'?` · <b>${a.st==='deferred'?'Ertelendi':'Kapatıldı'}${a.reason?': '+esc(a.reason):''}</b>`:''}</div><b>${esc(a.t)}</b><p class="small" style="margin-top:2px;color:var(--fg-2)">${esc(a.d)}</p></div>
 <div class="act">${a.st==='open'?`<button class="btn sm" data-pt="${a.pt}" data-go="insights">İncele</button><button class="btn sm" data-al="${a.id}:defer">7 gün ertele</button><button class="btn sm" data-al="${a.id}:fp">Yanlış pozitif</button><button class="btn sm primary" data-al="${a.id}:resolve">Değerlendirildi</button>`:`<button class="btn sm" data-al="${a.id}:reopen">Yeniden aç</button>`}</div></div>`).join('')||'<p class="muted small">Bu filtrede uyarı yok.</p>'}
POST.alerts=()=>{let f='open';drawAlerts(f);$('#alertFilter').onclick=e=>{const b=e.target.closest('button');if(!b)return;f=b.dataset.f;$$('#alertFilter button').forEach(x=>x.setAttribute('aria-pressed',x===b));drawAlerts(f)};
 $('#alertList').addEventListener('click',e=>{const b=e.target.closest('[data-al]');if(!b)return;const [id,act]=b.dataset.al.split(':');const a=state.alerts.find(x=>x.id===+id);
  if(act==='defer'){a.st='deferred';a.reason='7 gün';toast('Uyarı 7 gün ertelendi')}else if(act==='fp'){a.st='resolved';a.reason='yanlış pozitif';toast('Yanlış pozitif olarak kapatıldı · modele geri bildirildi')}else if(act==='resolve'){a.st='resolved';a.reason='hekim değerlendirdi';toast('Uyarı kapatıldı')}else{a.st='open';a.reason='';toast('Uyarı yeniden açıldı')}
  renderNav();drawAlerts(f)})}

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){if(g.dataset.pt!=null)state.pt=+g.dataset.pt;state.view=g.dataset.go;state.selDay=null;closeRail();render();return}
 const n=e.target.closest('.nav-btn');if(n){state.view=n.dataset.view;state.selDay=null;closeRail();render()}});
$('#ptSel').onchange=e=>{state.pt=+e.target.value;state.selDay=null;if(['dashboard','priority','alerts'].includes(state.view))state.view='overview';render()};
$('#rangeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;state.range=+b.dataset.r;state.selDay=null;render()};
function closeRail(){$('#rail').classList.remove('open');$('#scrim').hidden=true}
$('#menuBtn').onclick=()=>{$('#rail').classList.toggle('open');$('#scrim').hidden=!$('#rail').classList.contains('open')};
$('#scrim').onclick=closeRail;
// tooltip
const tip=$('#tip');
document.addEventListener('pointermove',e=>{const t=e.target.closest?.('[data-tip]');if(!t){tip.hidden=true;return}const [h,b]=t.dataset.tip.split('|');tip.innerHTML=`<b>${esc(h)}</b>${esc(b||'')}`;tip.hidden=false;const r=tip.getBoundingClientRect();let x=e.clientX+12,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-12;if(y+r.height>innerHeight-8)y=e.clientY-r.height-12;tip.style.left=x+'px';tip.style.top=y+'px'});
render();
</script>
